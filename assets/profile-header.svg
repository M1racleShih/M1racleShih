    <text x="69" y="203" fill="#a5f3fc" font-size="16" font-weight="650" letter-spacing="3.2">QUANTUM SOFTWARE  /  AI AGENTS  /  OPEN SOURCE</text>
    <text x="69" y="250" fill="#cbd5e1" font-size="17" font-weight="400">Building reliable tools from hardware topology to intelligent systems.</text>
    <text x="1129" y="286" fill="#94a3b8" fill-opacity="0.72" font-size="13" text-anchor="end" letter-spacing="1.4">@M1RACLESHIH</text>
