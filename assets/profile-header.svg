<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Han-Qing Shi</title>
  <desc id="desc">Quantum software, AI agents, and open source</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102544"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.78" cy="0.48" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.95" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
