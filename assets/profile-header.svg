    <path d="M755 236C822 287 924 286 1001 241S1101 118 1082 52" stroke="#c4b5fd" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M793 160H1118" stroke="#94a3b8" stroke-opacity="0.14"/>
    <path d="M918 48V276" stroke="#94a3b8" stroke-opacity="0.12"/>
  </g>

  <g stroke-width="2">
