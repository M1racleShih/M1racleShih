    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#cyanGlow)"/>
  <rect width="1200" height="320" rx="24" fill="url(#violetGlow)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <g fill="none" stroke-linecap="round">
